name: build-profile

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-profile:
    runs-on: ubuntu-latest
    # PROFILE_TOKEN (fine-grained PAT) is preferred so publish can create the
    # <user>/<user> repo on first run. Falls back to the default GITHUB_TOKEN
    # (which is enough to read + push once the repo exists). GH_TOKEN lets the
    # `gh` CLI fallback in build.ts work too.
    env:
      GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm run publish
